    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .module-card { background: #1e293b; border: 2px solid #334155; transition: all 0.2s ease; min-width: 160px; }
        .module-card.active { border-color: #10b981; background: #0f172a; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .module-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.8); }
        
        .pixel-cell { transition: all 0.1s ease; cursor: crosshair; position: relative; }
        .pixel-cell:hover { transform: scale(1.1); outline: 2px solid #10b981; z-index: 10; }
        .try-dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; }
        .try-dot.used { background-color: #ef4444; box-shadow: 0 0 5px #ef4444; }
        
        .correct-reveal { 
            outline: 4px solid #10b981 !important; 
            outline-offset: 2px; 
            z-index: 50; 
            position: relative; 
            box-shadow: 0 0 25px #10b981 !important;
            transform: scale(1.15);
        }

        .noise-overlay { position: relative; }
        .noise-overlay::after {
            content: ""; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.15; pointer-events: none; border-radius: inherit;
        }

        @keyframes pulse-emerald {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .active-pulse { animation: pulse-emerald 2s infinite; }
        
        .choice-btn { transition: all 0.2s ease; }
        .choice-btn.correct-choice { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.15) !important; color: #10b981 !important; }
        .choice-btn.wrong-choice { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.1) !important; opacity: 0.7; }
        
        .library-scroll { 
            scrollbar-width: thin; 
            scrollbar-color: #10b981 #0f172a; 
            overflow-y: auto;
        }
        .library-scroll::-webkit-scrollbar { width: 6px; }
        .library-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .library-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>

        function updateUI() {
            const menu = document.getElementById('module-menu');
            menu.innerHTML = state.modules.map((m, idx) => `
                <div class="module-card p-3 rounded-2xl flex items-center gap-3 ${state.currentModuleIdx === idx ? 'active' : ''} ${m.locked ? 'locked' : 'cursor-pointer hover:bg-slate-800'}"

        function startModule(idx) {
            state.currentModuleIdx = idx;
            state.isTransitioning = false;
            showIntro();
            updateUI();

            const mod = state.modules[state.currentModuleIdx];
            document.getElementById('intro-title').innerText = mod.name;
            document.getElementById('intro-icon').innerText = mod.icon;
            document.getElementById('intro-concept-text').innerText = mod.concept;
            document.getElementById('intro-instruction-text').innerText = mod.instruction;
            document.getElementById('intro-modal').classList.remove('hidden');
        }

        function dismissIntro() {
            document.getElementById('intro-modal').classList.add('hidden');
            renderLevel();
        }

        function renderLevel() {
            const module = state.modules[state.currentModuleIdx];
            const container = document.getElementById('screen-content');
            container.innerHTML = ""; 
            if (module.id === 0) renderRGB(container, module);
            else if (module.id === 1) renderClassification(container, module);
            else if (module.id === 2) renderDetection(container, module);
            else if (module.id === 3) renderLimitations(container, module);
        }

        function renderRGB(container, module) {
            if (module.attemptsThisRound >= module.maxRoundAttempts) {
                if (module.marks < module.target) return showRetryScreen(container);
                else { handleModuleSuccess(); return; }
            }
            state.isTransitioning = false;
            const q = module.attemptsThisRound + 1;
            let size, noise, diffLabel;
            if (q <= 50) { size = 6; noise = 90; diffLabel = "Standard Sweep"; } 
            else { size = 10; noise = 40; diffLabel = "Advanced Sweep"; }

            if (!state.currentRGBData || state.currentRGBData.questionNum !== q) {
                const target = [Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), Math.floor(Math.random() * 256)];
                const total = size * size;
                const targetPos = Math.floor(Math.random() * total);
                const gridColors = [];
                for (let i = 0; i < total; i++) {
                    if (i === targetPos) { gridColors.push({ r: target[0], g: target[1], b: target[2], correct: true }); } 
                    else { gridColors.push({
                        r: Math.max(0, Math.min(255, Math.round(target[0] + (Math.random() * noise * 2 - noise)))),
                        g: Math.max(0, Math.min(255, Math.round(target[1] + (Math.random() * noise * 2 - noise)))),
                        b: Math.max(0, Math.min(255, Math.round(target[2] + (Math.random() * noise * 2 - noise)))),
                        correct: false
                    }); }
                }
                state.currentRGBData = { questionNum: q, target, targetPos, gridColors, size, failedIndices: [] };
                state.rgbTries = 0;
            }

            const { target, gridColors, failedIndices } = state.currentRGBData;
            container.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="flex flex-col md:flex-row justify-between w-full mb-6 items-center gap-4">
                        <div class="flex items-center gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 w-full md:w-auto">
                            <div class="w-12 h-12 rounded-lg border-2 border-white shadow-md" style="background: rgb(${target[0]},${target[1]},${target[2]})"></div>
                            <div>
                                <div class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Target Signal</div>
                                <div class="mono text-emerald-400 font-bold">R:${target[0]} G:${target[1]} B:${target[2]}</div>
                            </div>
                        </div>
                        
                        <div id="probe-hud" class="flex-1 max-w-sm w-full bg-slate-950 px-6 py-4 rounded-3xl border-2 border-emerald-500/20 flex flex-col items-center justify-center transition-all duration-300">
                             <div class="text-[10px] text-emerald-500/50 font-black uppercase tracking-[0.3em] mb-1">Forensic HUD Probe</div>
                             <div id="hud-value" class="mono text-2xl font-black text-emerald-400">IDLE</div>
                             <div id="hud-bar" class="w-full h-1 bg-emerald-900/50 rounded-full mt-2 overflow-hidden">
                                <div id="hud-fill" class="h-full bg-emerald-500 w-0 transition-all"></div>
                             </div>
                        </div>

                        <div class="text-right">
                             <div class="text-[10px] uppercase font-bold text-slate-500 mb-1 italic">${diffLabel}: ${q}/100</div>
                             <div class="text-2xl font-black text-white">${module.marks}/20 Marks</div>
                             <div id="try-dots" class="flex gap-1 justify-end mt-1"></div>
                             <button onclick="toggleProbe()" class="mt-2 text-[9px] font-black uppercase tracking-tighter px-4 py-1 rounded-full border border-slate-700 bg-slate-800 hover:bg-slate-700 transition-colors">
                                ${state.probeActive ? 'DISABLE PROBE' : 'ENABLE PROBE'}
                             </button>
                        </div>
                    </div>
                    <div id="pixel-grid" class="grid gap-1 bg-slate-950 p-3 rounded-[2rem] shadow-inner border border-slate-800"></div>
                </div>
            `;

            const hud = document.getElementById('probe-hud');
            const hudVal = document.getElementById('hud-value');
            const hudFill = document.getElementById('hud-fill');
            const dotsCont = document.getElementById('try-dots');

            for(let i=0; i<5; i++) {
                const dot = document.createElement('div');
                dot.className = `try-dot ${i < state.rgbTries ? 'used' : ''}`;
                dotsCont.appendChild(dot);
            }

            const grid = document.getElementById('pixel-grid');
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            gridColors.forEach((color, i) => {
                const cell = document.createElement('div');
                cell.className = `rounded-lg pixel-cell ${size < 8 ? 'w-14 h-14' : 'w-9 h-9'}`;
                if (color.correct) cell.dataset.correct = "true";
                if (failedIndices.includes(i)) { cell.style.opacity = "0.1"; cell.style.pointerEvents = "none"; }
                cell.style.backgroundColor = `rgb(${color.r},${color.g},${color.b})`;
                
                cell.onmouseover = () => { 
                    if(state.probeActive) { 
                        hudVal.innerText = `R:${color.r} G:${color.g} B:${color.b}`; 
                        hud.style.borderColor = `rgba(${color.r},${color.g},${color.b}, 0.6)`;
                        hudVal.style.color = `rgb(${color.r},${color.g},${color.b})`;
                        hudFill.style.width = '100%';
                    } 
                };
                cell.onmouseleave = () => { 
                    if(state.probeActive) { 
                        hudVal.innerText = `IDLE`; 
                        hud.style.borderColor = `rgba(16, 185, 129, 0.2)`;
                        hudVal.style.color = '';
                        hudFill.style.width = '0%';
                    } 
                };
                cell.onclick = () => handlePixelClick(cell, i);
                grid.appendChild(cell);
            });
        }

        function toggleProbe() {
            state.probeActive = !state.probeActive;
            renderLevel();
        }

        function handlePixelClick(el, index) {
            if (state.isTransitioning) return;
            const mod = state.modules[0];
            if (el.dataset.correct === "true") {
                state.isTransitioning = true;
                mod.marks++; mod.attemptsThisRound++;
                el.classList.add('correct-reveal');
                setTimeout(() => { if (mod.marks >= 20) handleModuleSuccess(); else renderLevel(); }, 1000);
            } else {
                state.rgbTries++;
                state.currentRGBData.failedIndices.push(index);
                const dots = document.querySelectorAll('.try-dot');
                if (dots[state.rgbTries-1]) dots[state.rgbTries-1].classList.add('used');
                el.style.opacity = "0.1"; el.style.pointerEvents = "none";
                if (state.rgbTries >= 5) { 
                    state.isTransitioning = true;
                    const cp = document.querySelector('[data-correct="true"]');
                    if(cp) cp.classList.add('correct-reveal');
                    mod.attemptsThisRound++;
                    setTimeout(() => renderLevel(), 1500);
                }
            }
        }

        function renderClassification(container, module) {
            if (module.currentLevel >= module.totalLevels) {
                if (module.marks >= 15) { handleModuleSuccess(); return; }
                else showAlert("MISSION FAILED", "Required marks not achieved (15 needed).", "⚠️", "RETRY", () => { module.currentLevel = 0; module.marks = 0; renderLevel(); });
                return;
            }

            state.classificationAnswered = false;
            const item = emotionsData[module.currentLevel % emotionsData.length];
            const displayOptions = [...item.options].sort(() => Math.random() - 0.5);
            
            let blurAmount = 0;
            if (module.currentLevel >= 20) blurAmount = 15;
            else if (module.currentLevel >= 10) blurAmount = 6;
            
            container.innerHTML = `
                <div class="w-full max-w-5xl flex flex-col items-center">
                    <div class="text-center w-full max-w-lg mb-8">
                        <div class="flex justify-between items-center mb-6">
                            <div class="text-emerald-500 font-bold uppercase text-[10px] tracking-widest">Feed Quality: ${blurAmount > 0 ? (blurAmount > 10 ? 'POOR' : 'UNCERTAIN') : 'CLEAR'}</div>
                            <div id="class-marks" class="text-white font-bold tracking-tight">Progress: ${module.currentLevel + 1}/50 | Marks: ${module.marks}/15</div>
                        </div>
                        <h2 class="text-2xl font-bold mb-4 italic uppercase tracking-tight text-emerald-400">Interrogate Suspect:</h2>
                        <div class="bg-slate-950 p-12 rounded-[2.5rem] border-2 border-slate-800 mb-6 flex flex-col items-center justify-center noise-overlay overflow-hidden relative shadow-inner">
                            <div id="interrogation-img" class="text-[100px] transition-all duration-500" style="filter: blur(${blurAmount}px)">
                                ${item.img}
                            </div>
                            <div id="class-explanation" class="hidden mt-4 text-center">
                                <h4 id="class-status" class="text-xl font-black uppercase italic"></h4>
                                <button onclick="proceedToNextClass()" class="mt-4 bg-emerald-500 text-slate-950 px-8 py-2 rounded-xl font-black uppercase tracking-widest active-pulse">Next Case</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4" id="class-choices">
                            ${displayOptions.map((opt) => {
                                return `<button onclick="handleClassifyClick(this, '${opt}', '${item.correctVal}')" class="class-btn bg-slate-800 border-2 border-slate-700 p-5 rounded-2xl font-bold hover:border-emerald-500 hover:scale-105 transition-all text-lg shadow-lg uppercase">${opt}</button>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- SCALED BIOMETRIC DATABASE REFERENCE -->
                    <div class="w-full bg-slate-950/50 rounded-[2.5rem] border-2 border-slate-800 p-8 shadow-inner mb-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-emerald-400 font-black italic uppercase text-lg tracking-[0.2em]">Biometric Database Reference</h3>
                        </div>
                        <div class="h-96 library-scroll grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 p-4">
                            ${chartData.map(c => `
                                <div class="bg-slate-900 border-2 border-slate-800 p-6 rounded-2xl flex flex-col items-center text-center shadow-lg hover:border-emerald-500 transition-colors">
                                    <span class="text-5xl mb-3">${c.img}</span>
                                    <span class="text-[11px] font-black text-slate-200 leading-tight uppercase tracking-tight">${c.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleClassifyClick(btn, chosen, correct) {
            if (state.classificationAnswered) return;
            state.classificationAnswered = true;
            const isCorrect = (chosen === correct);
            const mod = state.modules[1];
            if (isCorrect) mod.marks++;
            
            const allBtns = document.querySelectorAll('.class-btn');
            allBtns.forEach(b => {
                if (b.innerText.trim() === correct) b.classList.add('correct-choice');
                else if (b.innerText.trim() === chosen && !isCorrect) b.classList.add('wrong-choice');
            });

            document.getElementById('interrogation-img').style.filter = "none";
            const expContainer = document.getElementById('class-explanation');
            const expStatus = document.getElementById('class-status');
            expContainer.classList.remove('hidden');
            expStatus.innerText = isCorrect ? "CORRECT ANALYSIS" : `ERROR: WAS ${correct}`;
            expStatus.className = isCorrect ? "text-emerald-400 text-xl font-black uppercase italic" : "text-rose-500 text-xl font-black uppercase italic";
            document.getElementById('class-marks').innerText = `Progress: ${mod.currentLevel + 1}/50 | Marks: ${mod.marks}/15`;
        }

        function proceedToNextClass() {
            const mod = state.modules[1];
            mod.currentLevel++;
            if (mod.marks >= 15) handleModuleSuccess();
            else renderLevel();
        }

        function renderDetection(container, module) {
            if (module.currentLevel >= module.totalLevels) {
                if (module.marks >= 5) { handleModuleSuccess(); return; }
                else showAlert("MISSION FAILED", "Required evidence not secured (5 needed).", "⚠️", "RETRY", () => { module.currentLevel = 0; module.marks = 0; renderLevel(); });
                return;
            }

            const targetsPerRound = module.currentLevel < 10 ? 3 : (module.currentLevel < 20 ? 5 : 6);
            state.detectionSubCount = 0;
            state.detectionRoundFailed = false;
            
            container.innerHTML = `
                <div class="text-center w-full">
                    <div class="flex justify-between items-center mb-6 px-4">
                         <div class="text-white font-black text-lg">Round: ${module.currentLevel + 1}/50</div>
                         <div class="text-emerald-400 font-black text-lg uppercase tracking-tighter">Evidence Secured: ${module.marks}/5</div>
                    </div>
                    <h2 class="text-3xl font-black mb-4 italic uppercase tracking-tighter">Locate ${targetsPerRound} Signal Sources</h2>
                    
                    <!-- SCALED WORD LIST -->
                    <div class="mb-8 bg-slate-800/80 p-6 rounded-[2rem] inline-block border-2 border-slate-700 shadow-xl">
                        <div class="text-slate-400 text-xs uppercase font-black mb-3 tracking-widest italic">Reference Word List</div>
                        <div class="flex gap-4 flex-wrap justify-center mt-1">
                            ${detectionObjects.map(w => `<span class="bg-slate-950 px-5 py-2 rounded-xl text-emerald-400 font-black border-2 border-emerald-500/30 text-lg uppercase shadow-inner">${w.name}</span>`).join('')}
                        </div>
                    </div>

                    <div id="detection-arena" class="bg-slate-950 border-4 border-slate-800 rounded-[4rem] h-[450px] relative overflow-hidden shadow-2xl">
                         <div class="absolute top-6 right-8 text-[12px] text-slate-600 font-black uppercase tracking-[0.2em]">Unsecured Signals: <span id="sub-target-count" class="text-emerald-500">${targetsPerRound}</span></div>
                    </div>
                </div>
            `;
            const arena = document.getElementById('detection-arena');

            for(let i=0; i<targetsPerRound; i++) {
                const target = detectionObjects[Math.floor(Math.random() * detectionObjects.length)];
                const el = document.createElement('div');
                // SCALED ICONS IN ARENA
                el.className = "absolute p-6 cursor-pointer border-2 border-dashed border-transparent hover:border-emerald-500 rounded-3xl transition-all";
                el.style.left = Math.random() * 85 + 5 + "%";
                el.style.top = Math.random() * 70 + 15 + "%";
                el.innerHTML = `<span class="text-6xl drop-shadow-lg">${target.icon}</span>`;
                
                el.onclick = () => {
                    if (state.detectionRoundFailed) return;
                    state.detectionAttempts = 3;
                    openLabelModal(target.name, (isCorrect) => {
                        if (isCorrect) {
                            el.className = "absolute p-6 border-4 border-emerald-500 bg-emerald-500/20 rounded-3xl pointer-events-none";
                            el.innerHTML += `<div class="absolute -top-8 left-0 text-[12px] bg-emerald-500 text-slate-950 px-3 py-1 font-black uppercase tracking-tighter rounded-full shadow-lg">${target.name} [0.99]</div>`;
                            handleDetectionFeedback(true, target.name, targetsPerRound, module);
                        } else {
                            state.detectionAttempts--;
                            if (state.detectionAttempts <= 0) {
                                 document.getElementById('label-modal').classList.add('hidden');
                                 state.detectionRoundFailed = true;
                                 handleDetectionFeedback(false, target.name, targetsPerRound, module);
                            } else { updateLabelModalUI(); }
                        }
                    });
                };
                arena.appendChild(el);
            }
        }

        function handleDetectionFeedback(correct, correctName, totalTargets, module) {
            if (!correct) {
                showAlert("SECURITY LOCKOUT", `Label failed. Round terminated. The correct label was ${correctName}.`, "❌", "NEXT CASE", () => {
                    module.currentLevel++;
                    renderLevel();
                });
                return;
            }
            state.detectionSubCount++;
            document.getElementById('sub-target-count').innerText = totalTargets - state.detectionSubCount;
            if (state.detectionSubCount >= totalTargets) {
                module.marks++;
                module.currentLevel++;
                showAlert("AREA SECURED", "All labels verified. Security mark awarded.", "🎯", "CONTINUE", () => {
                    if (module.marks >= 5) handleModuleSuccess(); else renderLevel();
                });
            }
        }

        function renderLimitations(container, module) {
            if (module.currentLevel >= module.totalLevels) {
                if (module.marks >= 10) { handleModuleSuccess(); return; }
                else showAlert("FAIL", "Analysis incomplete. Required: 10 marks.", "⚠️", "RETRY", () => { module.currentLevel = 0; module.marks = 0; renderLevel(); });
                return;
            }

            state.limitationsAnswered = false;
            const lv = curriculumCases[module.currentLevel % curriculumCases.length];
            const displayOptions = [...allPotentialLimits].sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="text-center w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-6">
                         <div class="text-emerald-500 font-black uppercase text-sm tracking-[0.2em]">Forensic Case ${module.currentLevel + 1}/20</div>
                         <div class="text-white font-black text-sm">Solved: ${module.marks}/10</div>
                    </div>
                    <h2 class="text-3xl font-black mb-6 text-white italic">${lv.case}</h2>
                    <div class="text-left bg-slate-800/50 p-8 rounded-[2rem] border-2 border-slate-700 mb-8 shadow-inner">
                        <div class="mb-6">
                            <h4 class="text-xs font-black text-slate-500 uppercase mb-2 tracking-widest italic">Scenario Details:</h4>
                            <p class="text-slate-100 text-2xl leading-relaxed font-semibold">${lv.desc}</p>
                        </div>
                        <div class="mb-8 bg-slate-900/60 p-6 rounded-2xl border border-slate-700/50">
                            <h4 class="text-xs font-black text-emerald-500 uppercase mb-2 tracking-widest italic">情境說明 (繁體中文):</h4>
                            <p class="text-emerald-50 text-2xl leading-relaxed font-bold">${lv.zh}</p>
                        </div>
                        <div class="h-px bg-slate-700 w-full mb-6 opacity-30"></div>
                        <h4 class="text-emerald-400 font-black text-xl italic tracking-tight">Which of the following categories best describes this scenario?</h4>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10" id="choices-grid">
                        ${displayOptions.map((opt) => `
                            <button onclick="handleLimitChoice(this, '${opt}')" 
                                    class="choice-btn bg-slate-800 border-2 border-slate-700 p-8 rounded-2xl font-bold hover:border-emerald-500 transition-all text-xl italic shadow-lg">
                                ${opt}
                            </button>`).join('')}
                    </div>

                    <div id="explanation-container" class="hidden text-left bg-slate-950/80 p-10 rounded-[2.5rem] border-4 border-slate-800 animate-fade-in shadow-2xl">
                        <h4 id="explanation-status" class="text-3xl font-black mb-4 italic"></h4>
                        <p id="explanation-text" class="text-slate-200 text-2xl mb-10 leading-relaxed italic"></p>
                        <button id="next-limit-btn" onclick="proceedToNextLimit()" class="w-full bg-emerald-500 text-slate-950 font-black py-6 rounded-2xl text-2xl uppercase tracking-[0.2em] active-pulse shadow-xl">Next Question</button>
                    </div>
                </div>
            `;
        }

        function handleLimitChoice(btn, chosen) {
            if (state.limitationsAnswered) return;
            state.limitationsAnswered = true;
            const mod = state.modules[3];
            const lv = curriculumCases[mod.currentLevel % curriculumCases.length];
            const isCorrect = (chosen === lv.correct);
            if (isCorrect) mod.marks++;
            
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => {
                if (b.innerText.trim() === lv.correct) b.classList.add('correct-choice');
                else if (b.innerText.trim() === chosen && !isCorrect) b.classList.add('wrong-choice');
            });

            const expContainer = document.getElementById('explanation-container');
            const expStatus = document.getElementById('explanation-status');
            const expText = document.getElementById('explanation-text');
            
            expContainer.classList.remove('hidden');
            expStatus.innerText = isCorrect ? "Correct! Analysis Accurate" : "Wrong! Analysis Mismatch";
            expStatus.className = isCorrect ? "text-emerald-400 text-3xl font-black mb-4 italic" : "text-rose-500 text-3xl font-black mb-4 italic";
            expText.innerText = lv.explanation;
            expContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function proceedToNextLimit() {
            const mod = state.modules[3];
            mod.currentLevel++;
            if (mod.marks >= 10) handleModuleSuccess(); else renderLevel();
        }

        function handleModuleSuccess() {
            const mod = state.modules[state.currentModuleIdx];
            mod.completed = true;
            const next = state.modules[state.currentModuleIdx + 1];
            if (next) {
                next.locked = false;
                showAlert("MISSION COMPLETE", "Clue found! Go to the next mission to find more clues.", "🔓", "PROCEED", () => startModule(state.currentModuleIdx + 1));
            } else { showVictory(); }
            updateUI();
        }

        function showAlert(title, text, icon, btnText, callback) {
            const overlay = document.getElementById('msg-overlay');
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-text').innerText = text;
            document.getElementById('msg-icon').innerText = icon;
            document.getElementById('msg-btn').innerText = btnText;
            overlay.classList.remove('hidden');
            document.getElementById('msg-btn').onclick = () => { overlay.classList.add('hidden'); if (callback) callback(); };
        }

        function openLabelModal(targetName, callback) {
            const modal = document.getElementById('label-modal');
            const input = document.getElementById('label-input');
            const btn = document.getElementById('label-submit-btn');
            modal.classList.remove('hidden'); input.value = ""; input.focus();
            updateLabelModalUI();
            btn.onclick = () => {
                const val = input.value.trim();
                const isCorrect = val.toLowerCase() === targetName.toLowerCase();
                if (isCorrect) modal.classList.add('hidden');
                callback(isCorrect);
            };
            input.onkeypress = (e) => { if (e.key === 'Enter') btn.onclick(); };
        }

        function updateLabelModalUI() { document.getElementById('label-tries-display').innerText = `Attempts Remaining: ${state.detectionAttempts}`; }
        function showVictory() { document.getElementById('screen-content').innerHTML = `<div class="text-center space-y-12 mt-16"><div class="text-[120px]">🕵️‍♂️🏆</div><h2 class="text-7xl font-black text-white italic">SYSTEM SECURED</h2><button onclick="location.reload()" class="bg-emerald-500 text-slate-950 font-black px-20 py-8 rounded-[3rem] hover:scale-110 active-pulse uppercase tracking-[0.3em] shadow-2xl text-2xl">NEW CASE</button></div>`; }
        function showRetryScreen(container) { container.innerHTML = `<div class="text-center"><div class="text-9xl mb-8">⚠️</div><h2 class="text-5xl font-black text-rose-500 mb-12 uppercase italic">Signal Failure</h2><button onclick="state.modules[0].marks=0;state.modules[0].attemptsThisRound=0;state.currentRGBData=null;renderLevel()" class="bg-white text-slate-950 px-12 py-6 rounded-2xl font-black active-pulse shadow-2xl text-xl">REBOOT SCANNER</button></div>`; }
        function showAdminPrompt() { document.getElementById('admin-overlay').classList.remove('hidden'); document.getElementById('admin-pass').focus(); }
        function closeAdmin() { document.getElementById('admin-overlay').classList.add('hidden'); document.getElementById('admin-pass').value = ''; }
        
        function checkAdmin() {
            const p = document.getElementById('admin-pass').value;
            if (p === atob(_K2)) { 
                state.modules.forEach(m => {
                    m.locked = false;
                    if (m.id === 3) { m.marks = 0; m.completed = false; m.currentLevel = 0; } 
                    else { m.marks = m.target; m.completed = true; }
                });
                showAlert("SUPER ADMIN", "ALL ZONES UNLOCKED. JUMPING TO FINALE.", "🔓", "DISMISS", () => { closeAdmin(); updateUI(); startModule(3); });
            } else if (p === atob(_K1)) { 
                const nextLocked = state.modules.find(m => m.locked);
                if (nextLocked) {
                    nextLocked.locked = false;
                    const prev = state.modules.find(m => m.id === nextLocked.id - 1);
                    if (prev) { prev.marks = prev.target; prev.completed = true; }
                    showAlert("ADMIN", `Bypassing to ${nextLocked.name}`, "🔑", "OK", () => { closeAdmin(); updateUI(); startModule(nextLocked.id); });
                } else { closeAdmin(); }
            }
        }

        setInterval(() => {
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);

        window.onload = () => { startModule(0); };
    </script>

    <footer class="p-8 text-center text-slate-600 text-[11px] uppercase tracking-[0.4em] font-black">
        HK Form 1 Computer Studies // AI Forensic Lab V30.0 // FINAL STABLE BUILD
    </footer>
</body>
</html>
