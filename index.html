<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective: Professional Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .module-card { background: #1e293b; border: 2px solid #334155; transition: all 0.2s ease; min-width: 160px; }
        .module-card.active { border-color: #10b981; background: #0f172a; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .module-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.8); }
        .pixel-cell { transition: all 0.1s ease; cursor: crosshair; position: relative; }
        .pixel-cell:hover { transform: scale(1.1); outline: 2px solid #10b981; z-index: 10; }
        .try-dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; }
        .try-dot.used { background-color: #ef4444; box-shadow: 0 0 5px #ef4444; }
        .correct-reveal { outline: 4px solid #10b981 !important; outline-offset: 2px; z-index: 50; position: relative; box-shadow: 0 0 25px #10b981 !important; transform: scale(1.15); }
        .noise-overlay::after { content: ""; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.15; pointer-events: none; border-radius: inherit; }
        @keyframes pulse-emerald { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .active-pulse { animation: pulse-emerald 2s infinite; }
        .choice-btn.correct-choice { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.15) !important; color: #10b981 !important; }
        .choice-btn.wrong-choice { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.1) !important; opacity: 0.7; }
        .library-scroll { scrollbar-width: thin; scrollbar-color: #10b981 #0f172a; overflow-y: auto; }
        .library-scroll::-webkit-scrollbar { width: 6px; }
        .library-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .library-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const _K1 = "TGFhYWFhYW0="; 
        const _K2 = "TGFhbUxhYW0="; 

        const state = {
            modules: [
                { id: 0, name: "RGB Forensics", icon: "🎨", marks: 0, target: 20, completed: false, locked: false, attemptsThisRound: 0, maxRoundAttempts: 100, concept: "Computers represent color as numeric data (RGB). Higher intensity values mean more signal. Hover over pixels to scan their numeric signature.", instruction: "Identify the signal signature matching the target RGB coordinates. Use the HUD probe to see data before you click." },

        const allPotentialLimits = ["Increase Automation & Efficiency", "Enhance Safety & Convenience", "Secure Personalization", "Data Dependency & Bias", "Environmental Sensitivity", "Lack of Human Context"];

        const chartData = [
            { img: "😀", name: "GRINNING" }, { img: "😄", name: "SMILE" }, { img: "😃", name: "SMILEY" }, { img: "😬", name: "GRIMACING" }, { img: "😁", name: "GRIN" },

            { img: "😇", name: "INNOCENT" }, { img: "😆", name: "LAUGHING" }, { img: "😅", name: "SWEAT SMILE" }, { img: "😂", name: "JOY" }, { img: "😋", name: "YUM" },
            { img: "😢", name: "CRY" }, { img: "😭", name: "SOB" }, { img: "😓", name: "SWEAT" }, { img: "😰", name: "COLD SWEAT" }, { img: "😨", name: "FEARFUL" },
            { img: "😱", name: "SCREAM" }, { img: "😡", name: "RAGE" }, { img: "😠", name: "ANGRY" }, { img: "😤", name: "TRIUMPH" }, { img: "😳", name: "FLUSHED" },
            { img: "😴", name: "SLEEPING" }, { img: "🤓", name: "NERD" }, { img: "😎", name: "SUNGLASSES" }, { img: "😷", name: "MASK" }
        ];

        const curriculumCases = [
            { case: "Scenario 1: Night Watch", desc: "A security camera at 2:00 AM misses a person because there are no streetlights.", zh: "在凌晨2時，由於沒有路燈，監路電視未能發現行人。", correct: "Environmental Sensitivity", explanation: "Lighting is a critical factor. Without sufficient light, AI sensors cannot distinguish data." },
            { case: "Scenario 2: Factory Speed", desc: "A robotic arm uses CV to sort 5,000 eggs in one hour without getting tired.", zh: "機械臂使用電腦視覺在一小時內分揀5,000個雞蛋而不會疲倦。", correct: "Increase Automation & Efficiency", explanation: "AI can perform repetitive tasks at much higher speeds than human workers." },
            { case: "Scenario 3: Smart Braking", desc: "A self-driving car detects a child running onto the road and stops instantly.", zh: "自動駕駛汽車檢測到小孩衝出馬路並立即停下。", correct: "Enhance Safety & Convenience", explanation: "AI reacts faster than human reflex time, preventing accidents." },
            { case: "Scenario 4: The 6-Finger Error", desc: "An AI creates a photo of a hand, but it gives the hand 6 fingers by mistake.", zh: "人工智能生成的照片中，手部錯誤地出現了6根手指。", correct: "Lack of Human Context", explanation: "AI understands pixel patterns but lacks real-world understanding of anatomy." },
            { case: "Scenario 5: Face ID", desc: "A smartphone only unlocks when it sees the owner's face, keeping the data safe.", zh: "智能手機僅在看到主人的臉時解鎖，確保數據安全。", correct: "Secure Personalization", explanation: "Biometric identification recognizes and serves only its specific user." },
            { case: "Scenario 6: Sun Glare", desc: "A camera is blinded by a direct beam of sunlight and cannot see the traffic light.", zh: "相機被陽光直射導致過曝，無法看清交通燈。", correct: "Environmental Sensitivity", explanation: "Extreme light changes like glare are significant limitations." },
            { case: "Scenario 7: Camouflage", desc: "AI misses a green bag sitting on green grass because the colors are too similar.", zh: "AI 未能發現綠色草地上的綠色袋子，因為顏色太接近。", correct: "Environmental Sensitivity", explanation: "When target and background colors are too similar, AI struggles with contrast." },
            { case: "Scenario 8: Foggy Road", desc: "A computer cannot detect the car in front because of very thick smoke and fog.", zh: "由於濃煙和霧氣，電腦無法檢測到前方的車輛。", correct: "Environmental Sensitivity", explanation: "Weather conditions act as noise that blocks visual data." },
            { case: "Scenario 9: Smart Shopping", desc: "A supermarket uses AI to track items so customers can pay without waiting in line.", zh: "超市使用 AI 追蹤商品，讓顧客無需排隊即可付款。", correct: "Increase Automation & Efficiency", explanation: "Automating identification removes the bottleneck of human checkout lines." },
            { case: "Scenario 10: Mirror Ghost", desc: "AI sees a reflection in a mirror and thinks there are two people in the room.", zh: "AI 看見鏡中的倒影，以為房內有兩個人。", correct: "Lack of Human Context", explanation: "AI lacks common sense to understand physical phenomena like reflections." },
            { case: "Scenario 11: Shadow Wall", desc: "AI mistakes a long shadow on the wall for a person and calls the police.", zh: "AI 將牆上的長陰影誤認為人，並報警處理。", correct: "Environmental Sensitivity", explanation: "Shadows create high contrast that can confuse depth and object perception." },
            { case: "Scenario 12: Personalized News", desc: "Your tablet recognizes your face and instantly displays your favorite apps.", zh: "你的平板電腦識別你的臉後，立即顯示你最喜愛的應用程序。", correct: "Secure Personalization", explanation: "AI uses individual features to deliver a customized user experience." },
            { case: "Scenario 13: 24/7 Patrol", desc: "An AI robot patrols a school all night without needing street lights using infrared CV.", zh: "一個使用紅外線電腦視覺的 AI 機器人在不需要路燈的情況下巡邏學校整個晚上。", correct: "Increase Automation & Efficiency", explanation: "AI provides tireless monitoring using sensors that exceed human vision." },
            { case: "Scenario 14: Polka-Dot Ghost", desc: "AI cannot find a person wearing a polka-dot shirt standing in front of a matching wall.", zh: "AI 找不到站在同樣波點牆壁前，穿著波點襯衫的人。", correct: "Environmental Sensitivity", explanation: "Complex patterns and background noise make it difficult for AI to detect object boundaries." },
            { case: "Scenario 15: AI Anatomy Error", desc: "AI draws a human face with three eyes because it hasn't seen enough real faces.", zh: "AI 畫了一張有三隻眼睛的人臉，因為它沒有看過足夠的真實人臉。", correct: "Data Dependency & Bias", explanation: "AI models depend entirely on the quality and variety of data they were trained on." },
            { case: "Scenario 16: Reflection Trap", desc: "A self-driving car tries to avoid a car that is only a reflection in a glass building.", zh: "自動駕駛汽車試圖避開一輛僅僅是玻璃大樓反射出來的車。", correct: "Lack of Human Context", explanation: "AI lacks the common sense to distinguish between reflections and physical objects." },
            { case: "Scenario 17: Emergency Stop", desc: "AI vision detects a red light 200 meters away and starts slowing down before the human driver sees it.", zh: "AI 視覺檢測到 200 米外的紅燈，並在人類司機看到之前開始減速。", correct: "Enhance Safety & Convenience", explanation: "AI processing speed and range can prevent accidents through early detection." },
            { case: "Scenario 18: Gender Bias", desc: "An AI classification system consistently fails to recognize female faces in a company database.", zh: "一個 AI 分類系統在公司數據庫中始終無法識別女性面孔。", correct: "Data Dependency & Bias", explanation: "Training AI with unbalanced data sets leads to biased and inaccurate results." },
            { case: "Scenario 19: Floating Bottle", desc: "AI generates a picture of a bottle floating in mid-air with no table.", zh: "AI 生成了一張瓶子懸浮在半空中、下面沒有桌子的照片。", correct: "Lack of Human Context", explanation: "AI generates patterns but does not understand physical laws like gravity." },
            { case: "Scenario 20: Glare Blindness", desc: "A car camera is blinded by the morning sun and misses a stop sign.", zh: "汽車攝像頭被晨光遮擋，錯過了停止標誌。", correct: "Environmental Sensitivity", explanation: "Extreme light conditions like glare are a significant limitation for visual sensors." }
        ];

        const detectionObjects = [
            { icon: "💾", name: "Disk" }, { icon: "📹", name: "Camera" }, { icon: "🔌", name: "Cable" }, { icon: "🗄️", name: "Server" }, 
            { icon: "📦", name: "Box" }, { icon: "💻", name: "Laptop" }, { icon: "⌨️", name: "Keyboard" }, { icon: "🖱️", name: "Mouse" }, { icon: "📱", name: "Phone" }
        ];

        function updateUI() {
            const menu = document.getElementById('module-menu');
            menu.innerHTML = state.modules.map((m, idx) => `
                <div class="module-card p-3 rounded-2xl flex items-center gap-3 ${state.currentModuleIdx === idx ? 'active' : ''} ${m.locked ? 'locked' : 'cursor-pointer hover:bg-slate-800'}" 
                     onclick="${!m.locked ? `startModule(${idx})` : ''}">
                    <span class="text-xl">${m.icon}</span>
                    <div class="whitespace-nowrap">
                        <div class="text-[11px] font-black text-white uppercase italic">${m.name}</div>
                        <div class="text-[9px] text-slate-500 uppercase font-bold">${m.completed ? 'SOLVED' : (m.locked ? 'LOCKED' : 'ACTIVE')}</div>
                    </div>
                </div>
            `).join('');
        }

        function startModule(idx) {
            state.currentModuleIdx = idx;
            state.isTransitioning = false;
            showIntro();
            updateUI();
        }

        function showIntro() {
            const mod = state.modules[state.currentModuleIdx];
            document.getElementById('intro-title').innerText = mod.name;
            document.getElementById('intro-icon').innerText = mod.icon;
            document.getElementById('intro-concept-text').innerText = mod.concept;
            document.getElementById('intro-instruction-text').innerText = mod.instruction;
            document.getElementById('intro-modal').classList.remove('hidden');
        }

        function dismissIntro() {
            document.getElementById('intro-modal').classList.add('hidden');
            renderLevel();
        }

        function renderLevel() {
            const module = state.modules[state.currentModuleIdx];
            const container = document.getElementById('screen-content');
            container.innerHTML = ""; 
            if (module.id === 0) renderRGB(container, module);
            else if (module.id === 1) renderClassification(container, module);
            else if (module.id === 2) renderDetection(container, module);
            else if (module.id === 3) renderLimitations(container, module);
        }

        function renderRGB(container, module) {
            if (module.attemptsThisRound >= module.maxRoundAttempts) {
                if (module.marks < module.target) return showRetryScreen(container);
                else { handleModuleSuccess(); return; }
            }
            state.isTransitioning = false;
            const q = module.attemptsThisRound + 1;
            let size = q <= 50 ? 6 : 10;
            let noise = q <= 50 ? 90 : 40;

            if (!state.currentRGBData || state.currentRGBData.questionNum !== q) {
                const target = [Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), Math.floor(Math.random() * 256)];
                const total = size * size;
                const targetPos = Math.floor(Math.random() * total);
                const gridColors = [];
                for (let i = 0; i < total; i++) {
                    if (i === targetPos) { gridColors.push({ r: target[0], g: target[1], b: target[2], correct: true }); } 
                    else { gridColors.push({
                        r: Math.max(0, Math.min(255, Math.round(target[0] + (Math.random() * noise * 2 - noise)))),
                        g: Math.max(0, Math.min(255, Math.round(target[1] + (Math.random() * noise * 2 - noise)))),
                        b: Math.max(0, Math.min(255, Math.round(target[2] + (Math.random() * noise * 2 - noise)))),
                        correct: false
                    }); }
                }
                state.currentRGBData = { questionNum: q, target, targetPos, gridColors, size, failedIndices: [] };
                state.rgbTries = 0;
            }

            const { target, gridColors, failedIndices } = state.currentRGBData;
            container.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <div class="flex flex-col md:flex-row justify-between w-full mb-6 items-center gap-4">
                        <div class="flex items-center gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 w-full md:w-auto">
                            <div class="w-12 h-12 rounded-lg border-2 border-white" style="background: rgb(${target[0]},${target[1]},${target[2]})"></div>
                            <div>
                                <div class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Target Signal</div>
                                <div class="mono text-emerald-400 font-bold text-lg">R:${target[0]} G:${target[1]} B:${target[2]}</div>
                            </div>
                        </div>
                        <div id="probe-hud" class="flex-1 max-w-sm w-full bg-slate-950 px-6 py-4 rounded-3xl border-2 border-emerald-500/20 flex flex-col items-center justify-center transition-all">
                             <div class="text-[10px] text-emerald-500/50 font-black uppercase tracking-[0.3em] mb-1">HUD Probe</div>
                             <div id="hud-value" class="mono text-2xl font-black text-emerald-400 uppercase tracking-tighter">Idle</div>
                        </div>
                        <div class="text-right">
                             <div class="text-[10px] uppercase font-bold text-slate-500 mb-1 italic">Sweep: ${q}/100</div>
                             <div class="text-2xl font-black text-white">${module.marks}/20 Marks</div>
                             <div id="try-dots" class="flex gap-1 justify-end mt-1"></div>
                             <button onclick="toggleProbe()" class="mt-2 text-[9px] font-black uppercase px-4 py-1 rounded-full border border-slate-700 bg-slate-800">${state.probeActive ? 'Disable Probe' : 'Enable Probe'}</button>
                        </div>
                    </div>
                    <div id="pixel-grid" class="grid gap-1 bg-slate-950 p-3 rounded-[2rem] border border-slate-800 shadow-inner"></div>
                </div>
            `;

            const hudVal = document.getElementById('hud-value');
            const dotsCont = document.getElementById('try-dots');
            for(let i=0; i<5; i++) {
                const dot = document.createElement('div');
                dot.className = `try-dot ${i < state.rgbTries ? 'used' : ''}`;
                dotsCont.appendChild(dot);
            }

            const grid = document.getElementById('pixel-grid');
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            gridColors.forEach((color, i) => {
                const cell = document.createElement('div');
                cell.className = `rounded-lg pixel-cell ${size < 8 ? 'w-14 h-14' : 'w-9 h-9'}`;
                if (color.correct) cell.dataset.correct = "true";
                if (failedIndices.includes(i)) { cell.style.opacity = "0.1"; cell.style.pointerEvents = "none"; }
                cell.style.backgroundColor = `rgb(${color.r},${color.g},${color.b})`;
                
                cell.onmouseover = () => { if(state.probeActive) { hudVal.innerText = `R:${color.r} G:${color.g} B:${color.b}`; } };
                cell.onmouseleave = () => { if(state.probeActive) { hudVal.innerText = `Idle`; } };
                cell.onclick = () => handlePixelClick(cell, i);
                grid.appendChild(cell);
            });
        }

        function toggleProbe() { state.probeActive = !state.probeActive; renderLevel(); }

        function handlePixelClick(el, index) {
            if (state.isTransitioning) return;
            const mod = state.modules[0];
            if (el.dataset.correct === "true") {
                state.isTransitioning = true;
                mod.marks++; mod.attemptsThisRound++;
                el.classList.add('correct-reveal');
                setTimeout(() => { if (mod.marks >= 20) handleModuleSuccess(); else renderLevel(); }, 1000);
            } else {
                state.rgbTries++;
                state.currentRGBData.failedIndices.push(index);
                el.style.opacity = "0.1"; el.style.pointerEvents = "none";
                const dots = document.querySelectorAll('.try-dot');
                if (dots[state.rgbTries-1]) dots[state.rgbTries-1].classList.add('used');
                if (state.rgbTries >= 5) { 
                    state.isTransitioning = true;
                    const cp = document.querySelector('[data-correct="true"]');
                    if(cp) cp.classList.add('correct-reveal');
                    mod.attemptsThisRound++;
                    setTimeout(() => renderLevel(), 1500);
                }
            }
        }

        function renderClassification(container, module) {
            state.classificationAnswered = false; // RESET LOCK
            const item = chartData[Math.floor(Math.random() * chartData.length)];
            const wrongItem = chartData.find(c => c.name !== item.name);
            const options = [item.name, wrongItem.name].sort(() => Math.random() - 0.5);
            let blur = module.currentLevel >= 20 ? 15 : (module.currentLevel >= 10 ? 6 : 0);
            
            container.innerHTML = `
                <div class="w-full max-w-5xl flex flex-col items-center">
                    <div class="text-center w-full max-w-lg mb-8">
                        <div class="flex justify-between items-center mb-4"><span class="text-white font-bold">Level: ${module.currentLevel + 1}/50</span><span class="text-emerald-400 font-bold">Marks: ${module.marks}/15</span></div>
                        <div class="bg-slate-950 p-12 rounded-[2rem] border-2 border-slate-800 mb-6 flex items-center justify-center noise-overlay overflow-hidden shadow-inner relative">
                            <div id="interrogation-img" class="text-[100px] transition-all duration-500" style="filter: blur(${blur}px)">${item.img}</div>
                            <div id="class-explanation" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 text-center">
                                <h4 id="class-status" class="text-xl font-black uppercase italic"></h4>
                                <button onclick="proceedToNextClass()" class="mt-4 bg-emerald-500 text-slate-950 px-8 py-2 rounded-xl font-black active-pulse uppercase">Next Case</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            ${options.map(opt => `<button onclick="handleClassifyClick(this, '${opt}', '${item.name}')" class="class-btn bg-slate-800 border-2 border-slate-700 p-5 rounded-2xl font-bold uppercase transition-all shadow-lg hover:border-emerald-500">${opt}</button>`).join('')}
                        </div>
                    </div>
                    <div class="w-full bg-slate-950/50 rounded-[2.5rem] border-2 border-slate-800 p-8 shadow-inner">
                        <h3 class="text-emerald-400 font-black italic uppercase text-lg mb-6 tracking-widest">Biometric Database Reference</h3>
                        <div class="h-96 library-scroll grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6 p-4">
                            ${chartData.map(c => `<div class="bg-slate-900 border-2 border-slate-800 p-6 rounded-2xl flex flex-col items-center text-center hover:border-emerald-500 transition-colors shadow-lg"><span class="text-5xl mb-3">${c.img}</span><span class="text-[10px] font-black text-slate-300 uppercase leading-tight">${c.name}</span></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleClassifyClick(btn, chosen, correct) {
            if (state.classificationAnswered) return;
            state.classificationAnswered = true;
            if (chosen === correct) state.modules[1].marks++;
            document.querySelectorAll('.class-btn').forEach(b => {
                if (b.innerText === correct) b.classList.add('correct-choice');
                else if (b.innerText === chosen && chosen !== correct) b.classList.add('wrong-choice');
            });
            document.getElementById('interrogation-img').style.filter = "none";
            const expContainer = document.getElementById('class-explanation');
            expContainer.classList.remove('hidden');
            const statusEl = document.getElementById('class-status');
            statusEl.innerText = chosen === correct ? "Correct Analysis" : `Error: Was ${correct}`;
            statusEl.className = chosen === correct ? "text-emerald-400 text-xl font-black uppercase italic" : "text-rose-500 text-xl font-black uppercase italic";
        }

        function proceedToNextClass() {
            state.modules[1].currentLevel++;
            if (state.modules[1].marks >= 15) handleModuleSuccess(); else renderLevel();
        }

        function renderDetection(container, module) {
            const targets = module.currentLevel < 10 ? 3 : (module.currentLevel < 20 ? 5 : 6);
            state.detectionSubCount = 0; state.detectionRoundFailed = false;
            container.innerHTML = `
                <div class="text-center w-full">
                    <div class="flex justify-between items-center mb-4"><span class="text-white font-bold">Round: ${module.currentLevel + 1}/50</span><span class="text-emerald-400 font-bold">Marks: ${module.marks}/5</span></div>
                    <h2 class="text-3xl font-black mb-6 italic uppercase tracking-tighter">Locate ${targets} Signal Sources</h2>
                    <div class="mb-8 flex gap-4 flex-wrap justify-center bg-slate-800/50 p-6 rounded-3xl border border-slate-700">
                        <span class="text-slate-500 font-black uppercase text-xs italic w-full">Reference Word List:</span>
                        ${detectionObjects.map(w => `<span class="bg-slate-950 px-5 py-2 rounded-xl text-emerald-400 font-black border-2 border-emerald-500/20 uppercase text-lg shadow-inner">${w.name}</span>`).join('')}
                    </div>
                    <div id="detection-arena" class="bg-slate-950 border-4 border-slate-800 rounded-[4rem] h-[450px] relative overflow-hidden shadow-inner"></div>
                </div>
            `;
            const arena = document.getElementById('detection-arena');
            for(let i=0; i<targets; i++) {
                const target = detectionObjects[Math.floor(Math.random() * detectionObjects.length)];
                const el = document.createElement('div');
                el.className = "absolute p-6 cursor-pointer border-2 border-dashed border-transparent hover:border-emerald-500 rounded-3xl transition-all";
                el.style.left = Math.random() * 85 + 5 + "%"; el.style.top = Math.random() * 70 + 15 + "%";
                el.innerHTML = `<span class="text-6xl drop-shadow-xl">${target.icon}</span>`;
                el.onclick = () => {
                    if (state.detectionRoundFailed) return;
                    state.detectionAttempts = 3;
                    openLabelModal(target.name, (isCorrect) => {
                        if (isCorrect) {
                            el.className = "absolute p-6 border-4 border-emerald-500 bg-emerald-500/20 rounded-3xl pointer-events-none scale-105 transition-transform";
                            el.innerHTML += `<div class="absolute -top-10 left-0 text-xs bg-emerald-500 text-slate-950 px-3 py-1 font-black uppercase tracking-tighter rounded-full shadow-lg">${target.name} [0.99]</div>`;
                            state.detectionSubCount++;
                            if (state.detectionSubCount >= targets) { 
                                state.modules[2].marks++; 
                                state.modules[2].currentLevel++; 
                                showAlert("Area Secured", "All labels verified.", "🎯", "Continue", () => state.modules[2].marks >= 5 ? handleModuleSuccess() : renderLevel()); 
                            }
                        } else {
                            state.detectionAttempts--;
                            if (state.detectionAttempts <= 0) { 
                                document.getElementById('label-modal').classList.add('hidden'); 
                                state.detectionRoundFailed = true; 
                                showAlert("Security Lockout", `Round Terminated. Correct label was ${target.name}.`, "❌", "Next", () => { state.modules[2].currentLevel++; renderLevel(); }); 
                            }
                            else document.getElementById('label-tries-display').innerText = `Attempts Remaining: ${state.detectionAttempts}`;
                        }
                    });
                };
                arena.appendChild(el);
            }
        }

        function renderLimitations(container, module) {
            state.limitationsAnswered = false; // RESET LOCK
            const lv = curriculumCases[module.currentLevel % curriculumCases.length];
            const displayOptions = [...allPotentialLimits].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <div class="text-center w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-6">
                         <div class="text-emerald-500 font-black uppercase text-sm tracking-[0.2em]">Forensic Case ${module.currentLevel + 1}/20</div>
                         <div class="text-white font-black text-sm">Solved: ${module.marks}/10</div>
                    </div>
                    <h2 class="text-3xl font-black mb-6 text-white italic">${lv.case}</h2>
                    <div class="text-left bg-slate-800/50 p-8 rounded-[2rem] border-2 border-slate-700 mb-8 shadow-inner">
                        <div class="mb-6">
                            <h4 class="text-xs font-black text-slate-500 uppercase mb-2 tracking-widest italic">Scenario Details:</h4>
                            <p class="text-slate-100 text-2xl leading-relaxed font-semibold">${lv.desc}</p>
                        </div>
                        <div class="mb-8 bg-slate-900/60 p-6 rounded-2xl border border-slate-700/50">
                            <h4 class="text-xs font-black text-emerald-500 uppercase mb-2 tracking-widest italic">情境說明 (繁體中文):</h4>
                            <p class="text-emerald-50 text-2xl leading-relaxed font-bold">${lv.zh}</p>
                        </div>
                        <div class="h-px bg-slate-700 w-full mb-6 opacity-30"></div>
                        <h4 class="text-emerald-400 font-black text-xl italic tracking-tight">Which of the following categories best describes this scenario?</h4>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                        ${displayOptions.map(opt => `<button onclick="handleLimitChoice(this, '${opt}', '${lv.correct}', '${lv.explanation}')" class="choice-btn bg-slate-800 border-2 border-slate-700 p-8 rounded-2xl font-bold text-xl italic shadow-lg hover:border-emerald-500 transition-all">${opt}</button>`).join('')}
                    </div>
                    <div id="explanation-container" class="hidden text-left bg-slate-950/80 p-10 rounded-[2.5rem] border-4 border-slate-800 shadow-2xl">
                        <h4 id="explanation-status" class="text-3xl font-black mb-4 italic"></h4>
                        <p id="explanation-text" class="text-slate-200 text-2xl mb-10 leading-relaxed italic"></p>
                        <button onclick="proceedToNextLimit()" class="w-full bg-emerald-500 text-slate-950 font-black py-6 rounded-2xl text-2xl uppercase shadow-xl active-pulse">Next Question</button>
                    </div>
                </div>
            `;
        }

        function handleLimitChoice(btn, chosen, correct, explanation) {
            if (state.limitationsAnswered) return;
            state.limitationsAnswered = true;
            if (chosen === correct) state.modules[3].marks++;
            document.querySelectorAll('.choice-btn').forEach(b => {
                if (b.innerText === correct) b.classList.add('correct-choice');
                else if (b.innerText === chosen && chosen !== correct) b.classList.add('wrong-choice');
            });
            const expContainer = document.getElementById('explanation-container');
            expContainer.classList.remove('hidden');
            const statusEl = document.getElementById('explanation-status');
            statusEl.innerText = chosen === correct ? "Correct! Analysis Accurate" : "Wrong! Analysis Mismatch";
            statusEl.className = chosen === correct ? "text-emerald-400 text-3xl font-black mb-4 italic" : "text-rose-500 text-3xl font-black mb-4 italic";
            document.getElementById('explanation-text').innerText = explanation;
            expContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function proceedToNextLimit() { state.modules[3].currentLevel++; if (state.modules[3].marks >= 10) handleModuleSuccess(); else renderLevel(); }

        function handleModuleSuccess() {
            const mod = state.modules[state.currentModuleIdx];
            mod.completed = true;
            const next = state.modules[state.currentModuleIdx + 1];
            if (next) { next.locked = false; showAlert("Mission Complete", "Clue found! Go to the next mission to find more clues.", "🔓", "Proceed", () => startModule(state.currentModuleIdx + 1)); }
            else document.getElementById('screen-content').innerHTML = `<div class="text-center space-y-12 mt-16"><div class="text-[120px] drop-shadow-2xl">🕵️‍♂️🏆</div><h2 class="text-7xl font-black text-white italic tracking-tighter">System Secured</h2><p class="text-slate-400 text-xl max-w-lg mx-auto font-medium leading-relaxed italic">The Data Phantom has been apprehended. Forensic training is 100% complete.</p><button onclick="location.reload()" class="bg-emerald-500 text-slate-950 font-black px-20 py-8 rounded-[3rem] text-2xl uppercase tracking-[0.2em] shadow-2xl active-pulse">New Case</button></div>`;
            updateUI();
        }

        function showAlert(title, text, icon, btnText, callback) {
            const overlay = document.getElementById('msg-overlay');
            document.getElementById('msg-title').innerText = title; document.getElementById('msg-text').innerText = text; document.getElementById('msg-icon').innerText = icon; document.getElementById('msg-btn').innerText = btnText;
            overlay.classList.remove('hidden');
            document.getElementById('msg-btn').onclick = () => { overlay.classList.add('hidden'); if (callback) callback(); };
        }

        function openLabelModal(targetName, callback) {
            const modal = document.getElementById('label-modal'); const input = document.getElementById('label-input'); const btn = document.getElementById('label-submit-btn');
            modal.classList.remove('hidden'); input.value = ""; input.focus();
            document.getElementById('label-tries-display').innerText = `Attempts Remaining: ${state.detectionAttempts}`;
            btn.onclick = () => { const val = input.value.trim(); const isCorrect = val.toLowerCase() === targetName.toLowerCase(); if (isCorrect) modal.classList.add('hidden'); callback(isCorrect); };
            input.onkeypress = (e) => { if (e.key === 'Enter') btn.onclick(); };
        }

        function showRetryScreen(container) { container.innerHTML = `<div class="text-center"><div class="text-9xl mb-8">⚠️</div><h2 class="text-5xl font-black text-rose-500 mb-12 uppercase italic tracking-tighter">Signal Failure</h2><button onclick="state.modules[0].marks=0;state.modules[0].attemptsThisRound=0;state.currentRGBData=null;renderLevel()" class="bg-white text-slate-950 px-12 py-6 rounded-2xl font-black shadow-2xl text-xl hover:bg-slate-200">Reboot Scanner</button></div>`; }
        function showAdminPrompt() { document.getElementById('admin-overlay').classList.remove('hidden'); document.getElementById('admin-pass').focus(); }
        function closeAdmin() { document.getElementById('admin-overlay').classList.add('hidden'); document.getElementById('admin-pass').value = ''; }
        function checkAdmin() {
            const p = document.getElementById('admin-pass').value;
            if (p === atob(_K2)) { state.modules.forEach(m => { m.locked = false; if (m.id === 3) { m.marks = 0; m.completed = false; m.currentLevel = 0; } else { m.marks = m.target; m.completed = true; } }); showAlert("Super Admin", "All zones unlocked.", "🔓", "Proceed", () => { closeAdmin(); updateUI(); startModule(3); }); }
            else if (p === atob(_K1)) { const next = state.modules.find(m => m.locked); if (next) { next.locked = false; const prev = state.modules[next.id - 1]; if (prev) { prev.marks = prev.target; prev.completed = true; } showAlert("Admin", `Bypassing to ${next.name}`, "🔑", "OK", () => { closeAdmin(); updateUI(); startModule(next.id); }); } }
        }

        setInterval(() => {
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);

        window.onload = () => startModule(0);
    </script>

    <footer class="p-8 text-center text-slate-600 text-[11px] uppercase tracking-[0.4em] font-black">
        HK Form 1 Computer Studies // AI Forensic Lab // Final Optimized Build V2
    </footer>
</body>
</html>
